services:
  - type: web
    name: lastmile-delivery-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./delivery_tracker.db
      - key: SECRET_KEY
        generateValue: true
